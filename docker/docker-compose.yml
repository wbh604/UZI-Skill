services:
  uzi-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: uzi-skill-web:latest
    container_name: uzi-web
    restart: unless-stopped
    ports:
      - "8977:8977"
    environment:
      UZI_WEB_HOST: 0.0.0.0
      UZI_WEB_PORT: 8977
      UZI_WEB_PUBLIC_BASE_URL: ${UZI_WEB_PUBLIC_BASE_URL:-}
      UZI_WEB_DEFAULT_DEPTH: ${UZI_WEB_DEFAULT_DEPTH:-lite}
      UZI_WEB_MAX_PARALLEL_JOBS: ${UZI_WEB_MAX_PARALLEL_JOBS:-1}
      UZI_WEB_MAX_QUEUE_SIZE: ${UZI_WEB_MAX_QUEUE_SIZE:-30}
      UZI_DINGTALK_NOTIFY_DEFAULT: ${UZI_DINGTALK_NOTIFY_DEFAULT:-false}
      UZI_SCHEDULE_ENABLED: ${UZI_SCHEDULE_ENABLED:-false}
      UZI_SCHEDULE_TIMES: ${UZI_SCHEDULE_TIMES:-}
      UZI_SCHEDULE_TICKERS: ${UZI_SCHEDULE_TICKERS:-}
      UZI_SCHEDULE_DEPTH: ${UZI_SCHEDULE_DEPTH:-lite}
      UZI_SCHEDULE_NOTIFY: ${UZI_SCHEDULE_NOTIFY:-true}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
      DINGTALK_SECRET: ${DINGTALK_SECRET:-}
      MX_APIKEY: ${MX_APIKEY:-}
      STOCK_NO_CACHE: ${STOCK_NO_CACHE:-}
    volumes:
      - ../data:/app/data
      - ../web-reports:/app/web-reports
      - ../cache:/app/skills/deep-analysis/scripts/.cache
      - ../reports:/app/skills/deep-analysis/scripts/reports
