name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Reject private rotation data in Git index
        run: python skills/deep-analysis/scripts/lib/industry_rotation/privacy.py

      - name: Verify dependency graph
        run: python -m pip check

      - name: Run offline test suite
        working-directory: skills/deep-analysis/scripts
        env:
          PYTHONPATH: .
          UZI_NO_UPDATE_CHECK: "1"
          UZI_SKIP_NETWORK_TESTS: "1"
        run: python -m pytest tests -q
